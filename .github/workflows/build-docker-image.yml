name: Build and publish docker images

# Publishes ghcr.io/<owner>/<repo>-web and -nginx. A run on the default
# branch tags them latest, for production; a run on any other branch tags
# them with the branch name, for staging. Every run also gets a tag of the
# branch name and commit. See "Deployment" in the README.

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push images to the registry'
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names and branch tag
        id: prep
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # Image names must be lower case
          IMAGE_BASE=$(echo "${REGISTRY}/${REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          BRANCH_TAG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')
          {
            echo "web_image=${IMAGE_BASE}-web"
            echo "nginx_image=${IMAGE_BASE}-nginx"
            echo "branch_tag=${BRANCH_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for web image (tags, labels)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.web_image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ steps.prep.outputs.branch_tag }},enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=sha,prefix=${{ steps.prep.outputs.branch_tag }}-

      - name: Extract metadata for nginx image (tags, labels)
        id: meta-nginx
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.nginx_image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=raw,value=${{ steps.prep.outputs.branch_tag }},enable=${{ github.ref_name != github.event.repository.default_branch }}
            type=sha,prefix=${{ steps.prep.outputs.branch_tag }}-

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web.Dockerfile
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx.Dockerfile
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta-nginx.outputs.tags }}
          labels: ${{ steps.meta-nginx.outputs.labels }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
