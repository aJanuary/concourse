server {
  server_name phpfm.local;

  root /var/www/html;

  error_page 404 /404;
  error_page 502 /502.html;

  location /resources {
    try_files $uri =404;
  }

  location ^~ /404 {
    internal;

    include fastcgi_params;
    fastcgi_pass web:9000;
    fastcgi_index index;
    fastcgi_intercept_errors off;
    fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name.php;
  }

  location ^~ /502.html {
    internal;
  }

  location ~ ^/api/conclar/apps/([^/]+)/selections$ {
    include fastcgi_params;
    fastcgi_pass web:9000;
    fastcgi_intercept_errors on;
    fastcgi_param SCRIPT_FILENAME $document_root/api/conclar/selections.php;
    fastcgi_param QUERY_STRING app_id=$1&$query_string;
  }

  location / {
    include fastcgi_params;
    fastcgi_pass web:9000;
    fastcgi_index index;
    fastcgi_intercept_errors on;
    fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name.php;
  }

  include mime.types;
  types {
    application/epub+zip epub;
  }
}