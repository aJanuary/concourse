#
# Development environment. Run scripts/bootstrap to create the secrets and
# start it; see "Development" in the README.
#
# Nothing here has a fixed container name and only nginx has a fixed host
# port (PORTAL_PORT, default 8080), so several checkouts can run at once as
# separate compose projects.
#

volumes:
  # Have a store for the DB data that persists across restarts
  portal-mysqldata:

services:
  db:
    image: mysql:9.7.2
    secrets:
      - db_root_password
      - db_dba_password
    restart: always
    environment:
      MYSQL_DATABASE: &db-name members
      MYSQL_USER: &db-user dba
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_dba_password
    # Make sure we have peristent data between restarts
    volumes:
      - portal-mysqldata:/var/lib/mysql
    ports:
      - "127.0.0.1::3306"

  nginx:
    restart: always
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./site/web:/var/www/html
    links:
      - web
    command: [nginx-debug, "-g", "daemon off;"]

  web:
    # The script will wait for db to be ready, run migrations and then start web server
    command: "/var/scripts/start.sh"
    restart: always
    build:
      context: .
      dockerfile: web.Dockerfile
    secrets:
      - db_dba_password
      - web_secrets
      # Uncomment, with the matching lines below, to keep the key for encrypted
      # secrets in its own file; see docs/configuration.md#encrypted-secrets
      #- config_encryption_key
    volumes:
      - ./scripts/start.sh:/var/scripts/start.sh
      - type: bind
        source: ./site/lib
        target: &lib-dir /srv/lib
      - type: bind
        source: ./site/web
        target: &web-dir /var/www/html
      - type: bind
        source: ./site/php-migrations
        target: /var/php-migrations
      - type: bind
        source: ./analytics
        target: /var/log/analytics
    environment:
      CONFIG_LIB_DIR: *lib-dir
      CONFIG_WEB_DIR: *web-dir
      CONFIG_ANALYTICS_DIR: /var/log/analytics
      CONFIG_DB_HOST: db
      CONFIG_DB_NAME: *db-name
      CONFIG_DB_USER: *db-user
      CONFIG_DB_PASSWORD_FILE: /run/secrets/db_dba_password
      CONFIG_SECRETS_FILE: /run/secrets/web_secrets
      #CONFIG_ENCRYPTION_KEY_FILE: /run/secrets/config_encryption_key
      RUNTIME_ENV: development
      XDEBUG_MODE: "${XDEBUG_MODE:-}"
    # php-fpm only listens once the start script has run the migrations, so
    # this is what `docker compose up --wait` waits for
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      start_period: 5m
      start_interval: 2s
    depends_on:
      - db
      - mailpit

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    ports:
      - "127.0.0.1::80"
    restart: always
    environment:
      PMA_HOST: db
    depends_on:
      - db

  # Catches all mail the portal sends; set [smtp] host = mailpit, port = 1025
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: always
    ports:
      - "127.0.0.1::8025"

secrets:
  db_root_password:
    # The root password for the database.
    # This should be a random string.
    file: ./secrets/db_root_password.txt
  db_dba_password:
    # The password for the database user.
    # This should be a random string.
    file: ./secrets/db_dba_password.txt
  web_secrets:
    # An ini file containing the secrets for the web server; see
    # docs/configuration.md.
    file: ./secrets/web_secrets.ini
  #config_encryption_key:
  #  file: ./secrets/config_encryption_key.txt
