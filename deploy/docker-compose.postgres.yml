#
# Runs the database on Postgres instead of MySQL. Enable it by setting, in
# the env file:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml
#
# and create its volume before the first start:
#
#   docker volume create portal-pgdata
#
volumes:
  portal-mysqldata: !reset null
  portal-pgdata:
    name: ${PORTAL_DB_VOLUME:-portal-pgdata}
    external: true

services:
  db:
    image: postgres:18.6
    environment: !override
      POSTGRES_DB: members
      POSTGRES_USER: dba
      POSTGRES_PASSWORD_FILE: /run/secrets/db_dba_password
    secrets: !override
      - db_dba_password
    volumes: !override
      - portal-pgdata:/var/lib/postgresql
    ports: !override
      - "127.0.0.1:${PORTAL_DB_PORT:-55432}:5432"

  web:
    environment:
      CONFIG_DB_DRIVER: pgsql
