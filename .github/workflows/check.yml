name: Check

# Builds the images and runs every migration from an empty database, then the
# db_* smoke test, on each database the portal supports.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db-driver: [mysql, pgsql]
    name: check (${{ matrix.db-driver }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build, start and migrate
        run: scripts/bootstrap ${{ matrix.db-driver }}

      - name: Check the portal responds
        run: curl --fail --silent --show-error --output /dev/null http://localhost:8080/login

      - name: Run the db smoke test
        run: docker compose exec -T web php /var/scripts/db-smoke.php

      - name: Check encrypted secrets
        run: docker compose exec -T -e HTTP_HOST=localhost web php < scripts/encryption-check.php

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
