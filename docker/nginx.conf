server {
  server_name phpfm.local;

  root /var/www/html;

  error_page 404 /404;

  location /resources {
    try_files $uri =404;
  }

  location ^~ /404 {
    internal;

    include fastcgi_params;
    fastcgi_pass web:9000;
    fastcgi_index index;
    fastcgi_intercept_errors off;
    fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name.php;
  }

  location / {
    include fastcgi_params;
    fastcgi_pass web:9000;
    fastcgi_index index;
    fastcgi_intercept_errors on;
    fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name.php;
  }
}