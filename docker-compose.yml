#
# Development environment. Run scripts/bootstrap to create the secrets and
# start it; see "Development" in the README.
#
# Nothing here has a fixed container name and only nginx has a fixed host
# port (PORTAL_PORT, default 8080), so several checkouts can run at once as
# separate compose projects.
#
version: "3.7"

volumes:
  # Have a store for the DB data that persists across restarts
  portal-mysqldata:

services:
  db:
    image: mysql:8.0.37-debian
    # mysql:*-debian has no arm64 build
    platform: linux/amd64
    secrets:
      - db_root_password
      - db_dba_password
    restart: always
    environment:
      MYSQL_DATABASE: &db-name members
      MYSQL_USER: &db-user dba
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_dba_password
    # Make sure we have peristent data between restarts
    volumes:
      - portal-mysqldata:/var/lib/mysql
    ports:
      - "127.0.0.1::3306"

  nginx:
    restart: always
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./site/web:/var/www/html
    links:
      - web
    command: [nginx-debug, "-g", "daemon off;"]

  web:
    # The script will wait for db to be ready, run migrations and then start web server
    command: "/var/scripts/start.sh"
    restart: always
    build:
      context: .
      dockerfile: web.Dockerfile
    secrets:
      - db_dba_password
      - web_secrets
    volumes:
      - ./scripts/start.sh:/var/scripts/start.sh
      - type: bind
        source: ./site/lib
        target: &lib-dir /srv/lib
      - type: bind
        source: ./site/web
        target: &web-dir /var/www/html
      - type: bind
        source: ./site/php-migrations
        target: /var/php-migrations
      - type: bind
        source: ./analytics
        target: /var/log/analytics
    environment:
      CONFIG_LIB_DIR: *lib-dir
      CONFIG_WEB_DIR: *web-dir
      CONFIG_ANALYTICS_DIR: /var/log/analytics
      CONFIG_DB_HOST: db
      CONFIG_DB_NAME: *db-name
      CONFIG_DB_USER: *db-user
      CONFIG_DB_PASSWORD_FILE: /run/secrets/db_dba_password
      CONFIG_SECRETS_FILE: /run/secrets/web_secrets
      RUNTIME_ENV: development
      XDEBUG_MODE: "${XDEBUG_MODE:-}"
    # php-fpm only listens once the start script has run the migrations, so
    # this is what `docker compose up --wait` waits for
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      start_period: 5m
      start_interval: 2s
    depends_on:
      - db
      - mailpit

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    ports:
      - "127.0.0.1::80"
    restart: always
    environment:
      PMA_HOST: db
    depends_on:
      - db

  # Catches all mail the portal sends; set [smtp] host = mailpit, port = 1025
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: always
    ports:
      - "127.0.0.1::8025"

secrets:
  db_root_password:
    # The root password for the database.
    # This should be a random string.
    file: ./secrets/db_root_password.txt
  db_dba_password:
    # The password for the database user.
    # This should be a random string.
    file: ./secrets/db_dba_password.txt
  web_secrets:
    # An ini file containing the secrets for the web server.
    #
    # [discord]
    #
    # ; The token for the Watson Discord bot.
    # ; This comes from the Discord Developer Portal.
    # bot_token =
    #
    # ; The client id and secret for the Discord bot used to initiate the
    # ; OAuth Flow
    # ; This comes from the Discord Developer Portal.
    # client_id =
    #
    # ; The client secret for the Discord  bot used to initiate the OAuth Flow.
    # ; This comes from the Discord Developer Portal.
    # client_secret =
    #
    # ; The shared secrets to use for the apis. The keys are the name of the
    # ; client, and the value is the shared secret. This should be a random
    # ; string.
    # [api_keys]
    #
    # [rce]
    #
    # ; The API key for the RingCentral Events API.
    # ; This comes from RingCentral.
    # api_key =
    #
    # ; The id of the ticket to generate magic links for.
    # ; This comes from the RingCentral event config.
    # ticket_id =
    #
    # [auth]
    # ; List of emails that are allowed to log into the portal.
    # ; If not specified, then anyone can log in.
    # allowlist[] =
    # ; Enabled login providers, in display order. Defaults to dev.
    # ; "local" is email login. "dev" lets you log in as any existing member
    # ; and is ignored unless RUNTIME_ENV is development.
    # providers[] =
    # ; The $_SERVER key holding the client address when behind a proxy that
    # ; sets it, e.g. HTTP_X_FORWARDED_FOR. Defaults to REMOTE_ADDR.
    # client_ip_header =
    #
    # [oidc]
    # ; Enable with `providers[] = oidc` in [auth]. See the README.
    # ; The issuer URL; endpoints are found through discovery.
    # provider_url =
    # client_id =
    # client_secret =
    # ; Defaults to email and profile (openid is always requested)
    # scopes[] =
    # ; Which userinfo claim supplies each member field. badge_no is required;
    # ; email and name default to the claims of the same name; real_name is
    # ; optional.
    # claims[badge_no] =
    # claims[email] =
    # claims[name] =
    # claims[real_name] =
    # ; Grants a role while the claim is truthy and removes it when not.
    # ; Roles not named here are never touched. Truthy is true, a non-zero
    # ; number, or the text true, 1, yes or on.
    # role_map[<claim>] = <role name>
    # ; Set to true to also log out at the provider when a member logs out of
    # ; the portal. The provider must allow <portal URL>/login as a
    # ; post-logout redirect URI.
    # provider_logout = false
    # ; Set to false to skip certificate checks, for a development provider
    # ; with a self-signed certificate. Never in production.
    # verify_tls = true
    #
    # [smtp]
    # ; Outgoing mail server, used by the local login provider.
    # host =
    # port =
    # username =
    # password =
    # ; Empty, tls or ssl
    # secure =
    #
    # [crypto]
    # ; Signs emailed links and hashes login codes. At least 32 characters.
    # ; Generate with `openssl rand -hex 32`
    # signing_key =
    #
    # [conclar]
    # ; Origins hosting ConClar, which may call the API with the session cookie.
    # ; No trailing slash.
    # allowed_origins[] = https://guide.example.com
    # ; Optional programme JSON, used to show item titles in the favourites report
    # schedule_url =
    #
    # [cookie]
    # ; The name of the session cookie. Defaults to "session". Changing it logs
    # ; everyone out, so use a different name for each deployment that shares a
    # ; parent domain (e.g. staging).
    # cookie_name =
    # ; The domain to set on the session cookie, e.g. .example.com.
    # ; Leave empty to use the current host only.
    # cookie_domain =
    #
    # Every section is optional. A feature whose section is missing fails with
    # an error naming the missing key when it is used.
    file: ./secrets/web_secrets.ini
