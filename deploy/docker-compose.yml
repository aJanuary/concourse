#
# Runs the portal from the published images. redeploy.sh starts it with an
# env file (.env.prod or .env.staging, from the examples here) that names
# the images and, for a second instance on the same host, its ports and
# directories. See "Deployment" in the README.
#
# Before the first start, create the database volume:
#
#   docker volume create portal-mysqldata
#

volumes:
  # Have a store for the DB data that persists across restarts
  portal-mysqldata:
    name: ${PORTAL_DB_VOLUME:-portal-mysqldata}
    external: true

services:
  db:
    image: mysql:9.7.2
    secrets:
      - db_root_password
      - db_dba_password
    restart: always
    environment:
      MYSQL_DATABASE: &db-name members
      MYSQL_USER: &db-user dba
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_dba_password
    volumes:
      # Make sure we have peristent data between restarts
      - portal-mysqldata:/var/lib/mysql
      # Optional: we can tune the MySQL config
      # - /opt/portal/etc/mysql/conf.d/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
    ports:
      # Only reachable from the host; not 3306 in case MySQL runs there too
      - "127.0.0.1:${PORTAL_DB_PORT:-53306}:3306"

  nginx:
    image: ${NGINX_IMAGE:?set NGINX_IMAGE in the env file}:${NGINX_IMAGE_TAG:-latest}
    restart: always
    ports:
      # For the host's proxy to forward to
      - "127.0.0.1:${PORTAL_PORT:-8080}:80"
    links:
      - web

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in the env file}:${WEB_IMAGE_TAG:-latest}
    # The script will wait for db to be ready, run migrations and then start web server
    command: "/var/scripts/start.sh"
    restart: always
    secrets:
      - db_dba_password
      - web_secrets
      # Uncomment, with the matching lines below, to keep the key for encrypted
      # secrets in its own file; see docs/configuration.md#encrypted-secrets
      #- config_encryption_key
    volumes:
      - type: bind
        source: ${PORTAL_DIR:-/opt/portal}/analytics
        target: &analytics-dir /var/log/analytics
    environment:
      CONFIG_LIB_DIR: /srv/lib
      CONFIG_WEB_DIR: /var/www/html
      CONFIG_ANALYTICS_DIR: *analytics-dir
      CONFIG_DB_HOST: db
      CONFIG_DB_NAME: *db-name
      CONFIG_DB_USER: *db-user
      CONFIG_DB_PASSWORD_FILE: /run/secrets/db_dba_password
      CONFIG_SECRETS_FILE: /run/secrets/web_secrets
      #CONFIG_ENCRYPTION_KEY_FILE: /run/secrets/config_encryption_key
      RUNTIME_ENV: production
    depends_on:
      - db

secrets:
  db_root_password:
    file: ${PORTAL_DIR:-/opt/portal}/secrets/db_root_password.txt
  db_dba_password:
    file: ${PORTAL_DIR:-/opt/portal}/secrets/db_dba_password.txt
  web_secrets:
    file: ${PORTAL_DIR:-/opt/portal}/secrets/web_secrets.ini
  #config_encryption_key:
  #  file: ${PORTAL_DIR:-/opt/portal}/secrets/config_encryption_key.txt
